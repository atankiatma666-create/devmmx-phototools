name: Set up site

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain only, or leave blank to keep saved value'
        required: false
      owner_name:
        description: 'Owner name, or leave blank to keep saved value'
        required: false
      contact_email:
        description: 'Contact email, or leave blank to keep saved value'
        required: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unpack uploaded zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "No zip found, skipping."; exit 0; fi
          rm -rf /tmp/unz && mkdir /tmp/unz && unzip -q "$ZIP" -d /tmp/unz
          SRC=/tmp/unz
          if [ -d /tmp/unz/devmmx-phototools ]; then SRC=/tmp/unz/devmmx-phototools; fi
          test -f "$SRC/tools/config.mjs" || { echo "::error::Wrong ZIP file."; exit 1; }
          rm -rf "$SRC/.github" "$SRC/site.config.json"
          rm -rf site tools tests
          cp -R "$SRC/." .
          git rm -q --cached "$ZIP" 2>/dev/null || true
          rm -f "$ZIP"

      - name: Save and apply details
        env:
          DOMAIN: ${{ inputs.domain }}
          OWNER: ${{ inputs.owner_name }}
          EMAIL: ${{ inputs.contact_email }}
        run: |
          node tools/config.mjs set --domain "$DOMAIN" --name "$OWNER" --email "$EMAIL"
          node tools/config.mjs status
          node tools/config.mjs prepublish || echo "::warning::Setup incomplete. Fill in the missing details."

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Set up site"
            git push
          fi
